[project]
name = "local-llm-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai==3.8.0",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]
