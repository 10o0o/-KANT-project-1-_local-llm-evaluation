[project]
name = "local-llm-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ollama==0.6.2",
    "openai==3.8.0",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval"]
